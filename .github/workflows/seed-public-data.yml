name: Seed public data

on:
  workflow_dispatch:
    inputs:
      translate_all:
        description: Backfill all supported question languages
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: seed-public-data-production
  cancel-in-progress: false

env:
  GCLOUD_PROJECT_ID: sneat-eur3-1

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      - name: Check out canonical country data
        uses: actions/checkout@v7
        with:
          repository: sneat-co/sneat-libs
          path: sneat-libs
          filter: tree:0

      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          service_account: deployer-to-gae@${{ env.GCLOUD_PROJECT_ID }}.iam.gserviceaccount.com
          workload_identity_provider: projects/588648831063/locations/global/workloadIdentityPools/github/providers/sneat-co

      - name: Seed categories, concepts, questions and issue options
        working-directory: backend
        run: >-
          go run ./cmd/seed
          --project "${GCLOUD_PROJECT_ID}"
          --confirm-production-project "${GCLOUD_PROJECT_ID}"
          --file ../catalog/seed.json
          ${{ inputs.translate_all && '--translate-all' || '' }}

      - name: Populate the canonical country choice axis
        working-directory: backend
        run: >-
          go run ./cmd/admin
          --action populate-countries
          --project "${GCLOUD_PROJECT_ID}"
          --confirm-production-project "${GCLOUD_PROJECT_ID}"
          --question world-country-actions
          --countries-file ../sneat-libs/libs/components/src/assets/data/countries.json
